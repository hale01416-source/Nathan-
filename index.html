<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nathan Dabira – Personal Webpage</title>
    <link rel="icon" type="image/png" href="good.png">

    <!-- Google Font for a clean professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #ffffff;
            color: #222;
            transition: background 0.5s, color 0.5s;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 500;
            margin-top: 40px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.7;
            max-width: 700px;
        }

        .button-row {
            margin-top: 20px;
        }

        .btn {
            padding: 12px 28px;
            margin: 6px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background-color: #f7f7f7;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .btn:hover {
            background-color: #eaeaea;
        }

        .btn:active {
            background-color: #dcdcdc;
        }
    </style>
</head>

<body id="page">

    <h1>Welcome to My Webpage</h1>
    <p>Hello! My name is <strong>Nathan Dabira</strong>. I’m new to coding, and this webpage is the start of my personal portfolio. I’ll be adding projects, pages, and more as I learn and grow.</p>

    <h2>Background Music</h2>
    <audio id="bgm" autoplay loop muted style="display:none;">
        <source src="nice3.mp3" type="audio/mpeg">
    </audio>

    <div class="button-row">
        <button class="btn" onclick="playAudio()">Play</button>
        <button class="btn" onclick="pauseAudio()">Pause</button>
        <button class="btn" onclick="toggleMute()">Mute / Unmute</button>
    </div>

    <h2>Background Color Options</h2>
    <div class="button-row">
        <button class="btn" onclick="setColor('red')">Red</button>
        <button class="btn" onclick="setColor('blue')">Blue</button>
        <button class="btn" onclick="setColor('yellow')">Yellow</button>
        <button class="btn" onclick="setColor('turquoise')">Turquoise</button>
        <button class="btn" onclick="darkMode()">Dark Mode</button>
        <button class="btn" onclick="lightMode()">Light Mode</button>
        <button class="btn" onclick="toggleContrast()">High Contrast</button>
        <button class="btn" onclick="rainbowMode()">Rainbow Mode</button>
        <button class="btn" onclick="resetAll()">Reset</button>
    </div>

    <script>
        // Autoplay handling
        window.addEventListener("load", () => {
            const audio = document.getElementById("bgm");

            audio.play().catch(() => {
                console.log("Autoplay blocked, waiting for click.");
            });

            document.addEventListener("click", () => {
                audio.muted = false;
                audio.volume = 1;
                audio.play();
            }, { once: true });
        });

        // Audio controls
        function playAudio() {
            document.getElementById("bgm").play();
        }

        function pauseAudio() {
            document.getElementById("bgm").pause();
        }

        function toggleMute() {
            const audio = document.getElementById("bgm");
            audio.muted = !audio.muted;
        }

        // Color modes
        let contrastOn = false;
        let rainbowInterval;

        function setColor(color) {
            document.body.style.backgroundColor = color;
        }

        function darkMode() {
            document.body.style.backgroundColor = "#111";
            document.body.style.color = "white";
        }

        function lightMode() {
            document.body.style.backgroundColor = "white";
            document.body.style.color = "black";
        }

        function toggleContrast() {
            contrastOn = !contrastOn;
            document.body.style.filter = contrastOn ? "invert(1) contrast(2)" : "none";
        }

        function resetAll() {
            document.body.style.backgroundColor = "";
            document.body.style.color = "";
            document.body.style.filter = "none";
            contrastOn = false;
            clearInterval(rainbowInterval);
        }

        function rainbowMode() {
            const colors = ["red", "orange", "yellow", "green", "blue", "purple"];
            let i = 0;
            clearInterval(rainbowInterval);
            rainbowInterval = setInterval(() => {
                document.body.style.backgroundColor = colors[i];
                i = (i + 1) % colors.length;
            }, 500);
        }
    </script>

</body>
</html>
