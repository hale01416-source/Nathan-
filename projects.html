<h2>These are the audio controls for the background music</h2>
<section>
  <!-- Start muted so autoplay works -->
  <audio id="bgm" autoplay loop muted style="display:none;">
    <source src="nice2.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Handle autoplay + unmute on first click
    window.addEventListener("load", () => {
      const audio = document.getElementById("bgm");
      audio.play().catch(() => {
        console.log("Autoplay blocked, waiting for click.");
      });

      // First user click will unmute and play
      document.addEventListener("click", () => {
        audio.muted = false;
        audio.volume = 1;
        audio.play();
      }, { once: true });
    });



    // Audio controls
    function playAudio() {
      const audio = document.getElementById("bgm");
      audio.muted = false; // ensure sound
      audio.play();
    }
    function pauseAudio() {
      document.getElementById("bgm").pause();
    }
    function toggleMute() {
      const audio = document.getElementById("bgm");
      audio.muted = !audio.muted;
    }
  </script>
</section>
<section>
  <div class="button-row">
    <button class="btn" onclick="playAudio()">Play</button>
    <button class="btn" onclick="pauseAudio()">Pause</button>
    <button class="btn" onclick="toggleMute()">Mute / Unmute</button>
  </div>
